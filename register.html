<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription — ENSTP Forum</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #c2410c, #9a3412);
}
.register-container {
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.logo-big {
  width: 80px; height: 80px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, #c2410c, #9a3412);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  color: #fff;
}
.register-container h1 {
  text-align: center;
  color: #1d2433;
  font-size: 1.5rem;
  margin-bottom: 8px;
}
.register-container p.sub {
  text-align: center;
  color: #667085;
  margin-bottom: 24px;
  font-size: .9rem;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  margin-bottom: 6px;
  color: #1d2433;
  font-weight: 600;
  font-size: .9rem;
}
.form-group input,
.form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #e5e1d8;
  border-radius: 12px;
  font-size: 1rem;
  background: #f6f4ef;
  outline: none;
  transition: all .2s;
  font-family: inherit;
}
.form-group input:focus,
.form-group select:focus {
  border-color: #c2410c;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(194,65,12,.1);
}
.form-group small {
  display: block;
  margin-top: 4px;
  color: #94a3b8;
  font-size: .8rem;
}
.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #c2410c, #9a3412);
  color: #fff;
  border: 0;
  border-radius: 12px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  margin-top: 8px;
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(194,65,12,.4);
}
.btn-submit:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}
.error-msg {
  display: none;
  background: #fee2e2;
  color: #991b1b;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 16px;
  font-size: .9rem;
  border-left: 4px solid #dc2626;
}
.error-msg.show { display: block; }
.success-msg {
  display: none;
  background: #d1fae5;
  color: #065f46;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 16px;
  font-size: .9rem;
  border-left: 4px solid #10b981;
}
.success-msg.show { display: block; }
.login-link {
  text-align: center;
  margin-top: 20px;
  font-size: .9rem;
  color: #667085;
}
.login-link a {
  color: #c2410c;
  font-weight: 600;
  text-decoration: none;
}
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="register-container">
  <div class="logo-big">👥</div>
  <h1>Inscription</h1>
  <p class="sub">ملتقى الطلبة ENSTP — Inscrivez-vous avec votre email universitaire</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="registerForm">
    <div class="form-group">
      <label for="name">Nom complet</label>
      <input type="text" id="name" placeholder="Ahmed Ben Ali" required>
    </div>

    <div class="form-group">
      <label for="email">Email universitaire</label>
      <input type="email" id="email" placeholder="prenom.nom@enstp.edu.dz" required>
      <small>⚠️ Uniquement @enstp.edu.dz</small>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Au moins 6 caractères" required minlength="6">
    </div>

    <div class="form-group">
      <label for="wilaya">Wilaya</label>
      <select id="wilaya" required>
        <option value="">— Choisir —</option>
      </select>
    </div>

    <div class="form-group">
      <label for="year">Année</label>
      <select id="year" required>
        <option value="">— Choisir —</option>
        <option value="1ère année Ingénieur">1ère année Ingénieur</option>
        <option value="2ème année Ingénieur">2ème année Ingénieur</option>
        <option value="3ème année Ingénieur">3ème année Ingénieur</option>
        <option value="4ème année Ingénieur">4ème année Ingénieur</option>
        <option value="5ème année Ingénieur">5ème année Ingénieur</option>
        <option value="Cycle préparatoire">Cycle préparatoire</option>
        <option value="Master">Master</option>
      </select>
    </div>

    <div class="form-group">
      <label for="groupe">Groupe</label>
      <input type="text" id="groupe" placeholder="G1, G2..." required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      Créer mon compte
    </button>
  </form>

  <div class="login-link">
    Déjà inscrit ? <a href="login.html">Se connecter</a>
  </div>
</div>

<script type="module">
import { registerUser, onAuthChange } from './auth.js';
import { WILAYAS } from './firebase-config.js';

// املأ الولايات
const wilayaSelect = document.getElementById('wilaya');
WILAYAS.forEach(w => {
  const opt = document.createElement('option');
  opt.value = w;
  opt.textContent = w;
  wilayaSelect.appendChild(opt);
});

// إذا كان مسجلاً، اذهب للصفحة الرئيسية
onAuthChange(user => {
  if (user) {
    window.location.href = 'forum.html';
  }
});

// معالج التسجيل
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const submitBtn = document.getElementById('submitBtn');
  
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');
  
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const wilaya = document.getElementById('wilaya').value;
  const year = document.getElementById('year').value;
  const groupe = document.getElementById('groupe').value.trim();
  
  // التحقق من البريد
  if (!email.toLowerCase().endsWith('@enstp.edu.dz')) {
    errorMsg.textContent = '⚠️ Utilisez uniquement votre email @enstp.edu.dz';
    errorMsg.classList.add('show');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Création...';
  
  try {
    await registerUser(email, password, name, wilaya, year, groupe);
    successMsg.textContent = '✅ Compte créé ! Redirection...';
    successMsg.classList.add('show');
    setTimeout(() => {
      window.location.href = 'forum.html';
    }, 1500);
  } catch (err) {
    console.error(err);
    let msg = 'Erreur : ' + err.message;
    if (err.code === 'auth/email-already-in-use') {
      msg = '❌ Cet email est déjà utilisé';
    } else if (err.code === 'auth/invalid-email') {
      msg = '❌ Email invalide';
    } else if (err.code === 'auth/weak-password') {
      msg = '❌ Mot de passe trop faible';
    }
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Créer mon compte';
  }
});
</script>

</body>
</html>
