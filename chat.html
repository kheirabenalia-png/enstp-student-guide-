<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat — ENSTP</title>
<link rel="stylesheet" href="style.css">
<style>
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg, #f6f4ef);
  color: var(--ink, #1d2433);
  font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ============================================
   HEADER
   ============================================ */
.chat-header {
  background: linear-gradient(135deg, #c2410c, #9a3412);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.chat-header .back-btn {
  background: rgba(255,255,255,.15);
  border: 0;
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
}
.chat-header .back-btn:hover { background: rgba(255,255,255,.3); }

.chat-header .room-info {
  flex: 1;
  min-width: 0;
}
.chat-header .room-info h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-header .room-info .room-sub {
  font-size: .78rem;
  opacity: .9;
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chat-header .room-info .status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ============================================
   MESSAGES
   ============================================ */
.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #f6f4ef;
}
.messages-container::-webkit-scrollbar { width: 8px; }
.messages-container::-webkit-scrollbar-track { background: transparent; }
.messages-container::-webkit-scrollbar-thumb {
  background: #d1d5db;
  border-radius: 4px;
}

.message {
  display: flex;
  gap: 8px;
  max-width: 78%;
  animation: msgSlide .25s ease-out;
}
@keyframes msgSlide {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.own {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message .msg-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c2410c, #9a3412);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: .85rem;
  flex-shrink: 0;
}
.message.own .msg-avatar {
  background: linear-gradient(135deg, #10b981, #059669);
}

.message .msg-content {
  min-width: 0;
}
.message .msg-name {
  font-size: .72rem;
  color: #667085;
  margin-bottom: 3px;
  font-weight: 600;
}
.message.own .msg-name {
  text-align: right;
  color: #10b981;
}

.message .msg-bubble {
  background: #fff;
  padding: 10px 14px;
  border-radius: 16px;
  border-top-left-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
  word-wrap: break-word;
  word-break: break-word;
  line-height: 1.5;
  font-size: .95rem;
  border: 1px solid #e5e1d8;
}
.message.own .msg-bubble {
  background: linear-gradient(135deg, #c2410c, #9a3412);
  color: #fff;
  border: 0;
  border-radius: 16px;
  border-top-right-radius: 4px;
}
.message .msg-time {
  font-size: .68rem;
  color: #94a3b8;
  margin-top: 3px;
}
.message.own .msg-time {
  text-align: right;
}

/* ============================================
   EMPTY / LOADING
   ============================================ */
.empty-chat, .loading-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  text-align: center;
  padding: 40px 20px;
  gap: 10px;
}
.empty-chat .icon, .loading-chat .icon {
  font-size: 4rem;
  margin-bottom: 10px;
}
.loading-chat .spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #fde8dc;
  border-top-color: #c2410c;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================
   INPUT BAR
   ============================================ */
.input-bar {
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid #e5e1d8;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,.05);
}
.input-bar textarea {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #e5e1d8;
  border-radius: 22px;
  font-size: .95rem;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  min-height: 44px;
  line-height: 1.4;
  background: #f6f4ef;
  transition: all .2s;
}
.input-bar textarea:focus {
  border-color: #c2410c;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(194,65,12,.1);
}
.input-bar .send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c2410c, #9a3412);
  color: #fff;
  border: 0;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
  box-shadow: 0 4px 12px rgba(194,65,12,.3);
}
.input-bar .send-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 18px rgba(194,65,12,.4);
}
.input-bar .send-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
}

/* ============================================
   MOBILE
   ============================================ */
@media (max-width: 600px) {
  .message { max-width: 88%; }
  .message .msg-avatar { width: 30px; height: 30px; font-size: .75rem; }
  .message .msg-bubble { font-size: .9rem; padding: 9px 12px; }
  .chat-header .room-info h1 { font-size: .95rem; }
  .input-bar textarea { font-size: 16px; } /* منع zoom في iOS */
}
</style>
</head>
<body>

<!-- Header -->
<div class="chat-header">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="room-info">
    <h1 id="roomTitle">Chargement...</h1>
    <div class="room-sub">
      <span class="status-dot"></span>
      <span id="roomSub">Connexion...</span>
    </div>
  </div>
</div>

<!-- Messages -->
<div class="messages-container" id="messagesContainer">
  <div class="loading-chat">
    <div class="spinner"></div>
    <p>Chargement des messages...</p>
  </div>
</div>

<!-- Input -->
<div class="input-bar">
  <textarea id="messageInput" placeholder="Écrivez votre message..." rows="1" maxlength="2000"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>📤</button>
</div>

<script type="module">
import { 
  auth, db,
  onAuthStateChanged,
  collection, query, where, orderBy, limit,
  addDoc, getDocs, getDoc, doc,
  onSnapshot, serverTimestamp
} from './firebase-config.js';

// ============================================
// المتغيرات
// ============================================
let currentUser = null;
let currentUserData = null;
let roomType = 'general'; // 'general' أو 'wilaya'
let roomName = 'Général';
let currentRoomId = null;
let unsubscribeMessages = null;

const messagesContainer = document.getElementById('messagesContainer');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

// ============================================
// قراءة معاملات الرابط
// ============================================
const urlParams = new URLSearchParams(window.location.search);

if (urlParams.get('room') === 'general') {
  roomType = 'general';
  roomName = '🌍 Salle générale ENSTP';
} else if (urlParams.get('wilaya')) {
  roomType = 'wilaya';
  roomName = '📍 ' + urlParams.get('wilaya');
} else {
  // افتراضي: الولاية (إذا كان مسجلاً)
  roomType = 'auto';
  roomName = 'Chargement...';
}

// ============================================
// التحقق من المستخدم
// ============================================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  
  currentUser = user;
  
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    currentUserData = snap.exists() ? snap.data() : {
      name: user.displayName || 'Étudiant',
      email: user.email,
      wilaya: 'غير محدد'
    };
  } catch(e) {
    currentUserData = {
      name: user.displayName || 'Étudiant',
      email: user.email,
      wilaya: 'غير محدد'
    };
  }
  
  // إذا كان auto، اختر ولاية المستخدم
  if (roomType === 'auto') {
    if (currentUserData.wilaya && currentUserData.wilaya !== 'غير محدد') {
      roomType = 'wilaya';
      roomName = '📍 ' + currentUserData.wilaya;
    } else {
      roomType = 'general';
      roomName = '🌍 Salle générale ENSTP';
    }
  }
  
  // حدد roomId
  if (roomType === 'general') {
    currentRoomId = 'general';
  } else {
    currentRoomId = 'wilaya_' + (currentUserData.wilaya || 'unknown');
    // إذا كنا في غرفة ولاية محددة، استخدمها
    const wilayaParam = urlParams.get('wilaya');
    if (wilayaParam) {
      currentRoomId = 'wilaya_' + wilayaParam;
      roomName = '📍 ' + wilayaParam;
    }
  }
  
  // حدّث العنوان
  document.getElementById('roomTitle').textContent = roomName;
  document.getElementById('roomSub').textContent = 'Connecté en tant que ' + currentUserData.name;
  document.title = roomName + ' — ENSTP Chat';
  
  // ابدأ الاستماع
  await loadMessages();
  setupInput();
});

// ============================================
// تحميل الرسائل (Realtime)
// ============================================
async function loadMessages() {
  messagesContainer.innerHTML = '<div class="loading-chat"><div class="spinner"></div><p>Chargement...</p></div>';
  
  try {
    const messagesRef = collection(db, 'chats', currentRoomId, 'messages');
    const q = query(messagesRef, orderBy('timestamp', 'asc'), limit(200));
    
    unsubscribeMessages = onSnapshot(q, (snapshot) => {
      const messages = [];
      snapshot.forEach(d => {
        messages.push({ id: d.id, ...d.data() });
      });
      renderMessages(messages);
    }, (error) => {
      console.error('Erreur messages:', error);
      messagesContainer.innerHTML = '<div class="empty-chat"><div class="icon">⚠️</div><p>Erreur de chargement</p><p style="font-size:.8rem;color:#94a3b8">Vérifiez les règles Firestore</p></div>';
    });
    
  } catch(e) {
    console.error('Erreur loadMessages:', e);
    messagesContainer.innerHTML = '<div class="empty-chat"><div class="icon">⚠️</div><p>Erreur: ' + e.message + '</p></div>';
  }
}

// ============================================
// عرض الرسائل
// ============================================
function renderMessages(messages) {
  if (!messages.length) {
    messagesContainer.innerHTML = '<div class="empty-chat"><div class="icon">💬</div><p>Aucun message pour l\'instant</p><p style="font-size:.85rem">Soyez le premier à écrire !</p></div>';
    return;
  }
  
  let html = '';
  messages.forEach(m => {
    const isOwn = m.from === currentUser.uid;
    const name = m.fromName || 'Étudiant';
    const initials = name.charAt(0).toUpperCase();
    const time = formatTime(m.timestamp);
    const text = escapeHtml(m.text || '');
    
    html += '<div class="message' + (isOwn ? ' own' : '') + '">';
    html += '<div class="msg-avatar">' + initials + '</div>';
    html += '<div class="msg-content">';
    html += '<div class="msg-name">' + (isOwn ? 'Moi' : name) + '</div>';
    html += '<div class="msg-bubble">' + text + '</div>';
    html += '<div class="msg-time">' + time + '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  messagesContainer.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }, 50);
}

function formatTime(ts) {
  if (!ts) return '';
  let date;
  if (ts.toDate) date = ts.toDate();
  else if (ts.seconds) date = new Date(ts.seconds * 1000);
  else date = new Date(ts);
  
  const now = new Date();
  const diff = (now - date) / 1000;
  
  if (diff < 60) return 'À l\'instant';
  if (diff < 3600) return Math.floor(diff / 60) + ' min';
  if (diff < 86400) return date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  return date.toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit'}) + ' ' + date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

// ============================================
// إعداد الإدخال
// ============================================
function setupInput() {
  messageInput.disabled = false;
  sendBtn.disabled = false;
  
  messageInput.addEventListener('input', () => {
    sendBtn.disabled = !messageInput.value.trim();
    
    // Auto-resize
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  });
  
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  
  messageInput.focus();
}

// ============================================
// إرسال رسالة
// ============================================
async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !currentUser) return;
  
  sendBtn.disabled = true;
  messageInput.value = '';
  messageInput.style.height = 'auto';
  
  try {
    await addDoc(collection(db, 'chats', currentRoomId, 'messages'), {
      from: currentUser.uid,
      fromName: currentUserData.name || 'Étudiant',
      fromWilaya: currentUserData.wilaya || '',
      text: text,
      timestamp: serverTimestamp()
    });
  } catch(e) {
    console.error('Erreur envoi:', e);
    alert('❌ Erreur: ' + e.message);
    messageInput.value = text;
  }
  
  sendBtn.disabled = false;
}

// ============================================
// الرجوع
// ============================================
function goBack() {
  if (unsubscribeMessages) unsubscribeMessages();
  window.location.href = 'forum.html';
}

// ============================================
// اجعل الدوال متاحة عالمياً
// ============================================
window.sendMessage = sendMessage;
window.goBack = goBack;
</script>

</body>
</html>
