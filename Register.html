<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription — ENSTP Forum</title>
<style>
:root{
  --acc:#c2410c;
  --acc2:#9a3412;
  --acc-soft:#fde8dc;
  --bg:#f6f4ef;
  --card:#fff;
  --ink:#1d2433;
  --mut:#667085;
  --line:#e5e1d8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
}
.register-container{
  width:100%;max-width:480px;
  background:#fff;border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.logo-big{
  width:80px;height:80px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;color:#fff;
}
h1{text-align:center;color:var(--ink);font-size:1.5rem;margin-bottom:8px}
.sub{text-align:center;color:var(--mut);margin-bottom:24px;font-size:.9rem}
.form-group{margin-bottom:16px}
.form-group label{
  display:block;margin-bottom:6px;
  color:var(--ink);font-weight:600;font-size:.9rem;
}
.form-group input,
.form-group select{
  width:100%;padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:1rem;background:var(--bg);
  outline:none;transition:all .2s;
  font-family:inherit;color:var(--ink);
}
.form-group input:focus,
.form-group select:focus{
  border-color:var(--acc);background:#fff;
  box-shadow:0 0 0 3px rgba(194,65,12,.1);
}
.form-group small{
  display:block;margin-top:4px;
  color:#94a3b8;font-size:.8rem;
}
.btn-submit{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:0;border-radius:12px;
  font-size:1.05rem;font-weight:700;
  cursor:pointer;transition:all .2s;
  font-family:inherit;margin-top:8px;
}
.btn-submit:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(194,65,12,.4);
}
.btn-submit:disabled{
  opacity:.6;cursor:not-allowed;transform:none;
}
.error-msg{
  display:none;background:#fee2e2;color:#991b1b;
  padding:12px 14px;border-radius:12px;
  margin-bottom:16px;font-size:.9rem;
  border-left:4px solid #dc2626;
  white-space:pre-wrap;word-break:break-word;
}
.error-msg.show{display:block}
.success-msg{
  display:none;background:#d1fae5;color:#065f46;
  padding:12px 14px;border-radius:12px;
  margin-bottom:16px;font-size:.9rem;
  border-left:4px solid #10b981;
}
.success-msg.show{display:block}
.login-link{
  text-align:center;margin-top:20px;
  font-size:.9rem;color:var(--mut);
}
.login-link a{color:var(--acc);font-weight:600;text-decoration:none}
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .6s linear infinite;
  margin-right:8px;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
.status{
  font-size:.75rem;color:var(--mut);
  text-align:center;margin-top:16px;
  padding:8px;background:var(--bg);
  border-radius:8px;
}
.status.ok{color:#065f46;background:#d1fae5}
.status.err{color:#991b1b;background:#fee2e2}
</style>
</head>
<body>

<div class="register-container">
  <div class="logo-big">👥</div>
  <h1>Inscription</h1>
  <p class="sub">ملتقى الطلبة ENSTP — Inscrivez-vous avec votre email universitaire</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="registerForm">
    <div class="form-group">
      <label for="name">Nom complet</label>
      <input type="text" id="name" placeholder="Ahmed Ben Ali" required>
    </div>

    <div class="form-group">
      <label for="email">Email universitaire</label>
      <input type="email" id="email" placeholder="prenom.nom@enstp.edu.dz" required>
      <small>⚠️ Uniquement @enstp.edu.dz</small>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Au moins 6 caractères" required minlength="6">
    </div>

    <div class="form-group">
      <label for="wilaya">Wilaya</label>
      <select id="wilaya" required>
        <option value="">— Choisir —</option>
      </select>
    </div>

    <div class="form-group">
      <label for="year">Année</label>
      <select id="year" required>
        <option value="">— Choisir —</option>
        <option value="1ère année Ingénieur">1ère année Ingénieur</option>
        <option value="2ème année Ingénieur">2ème année Ingénieur</option>
        <option value="3ème année Ingénieur">3ème année Ingénieur</option>
        <option value="4ème année Ingénieur">4ème année Ingénieur</option>
        <option value="5ème année Ingénieur">5ème année Ingénieur</option>
        <option value="Cycle préparatoire">Cycle préparatoire</option>
        <option value="Master">Master</option>
      </select>
    </div>

    <div class="form-group">
      <label for="groupe">Groupe</label>
      <input type="text" id="groupe" placeholder="G1, G2..." required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      Créer mon compte
    </button>
  </form>

  <div class="login-link">
    Déjà inscrit ? <a href="login.html">Se connecter</a>
  </div>

  <div class="status" id="status">⏳ Chargement Firebase...</div>
</div>

<script type="module">
// ============================================
// استيراد Firebase
// ============================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  updateProfile,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  setDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ============================================
// Firebase Config
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyD35OVZ9JPlWr7ayQJMu8yVPFu3N_gZD1g",
  authDomain: "enstp-forum-19a28.firebaseapp.com",
  projectId: "enstp-forum-19a28",
  storageBucket: "enstp-forum-19a28.firebasestorage.app",
  messagingSenderId: "598736412518",
  appId: "1:598736412518:web:a2a7c69a537e6567ffb2a7"
};

// ============================================
// تهيئة Firebase
// ============================================
let app, auth, db;
const statusEl = document.getElementById('status');

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  statusEl.textContent = '✅ Firebase prêt';
  statusEl.classList.add('ok');
} catch (e) {
  statusEl.textContent = '❌ Erreur Firebase : ' + e.message;
  statusEl.classList.add('err');
  console.error(e);
}

// ============================================
// قائمة الولايات (69)
// ============================================
const WILAYAS = [
  "أدرار", "الشلف", "الأغواط", "أم البواقي", "باتنة", "بجاية", "بسكرة", "بشار",
  "البليدة", "البويرة", "تمنراست", "تبسة", "تلمسان", "تيارت", "تيزي وزو", "الجزائر",
  "الجلفة", "جيجل", "سطيف", "سعيدة", "سكيكدة", "سيدي بلعباس", "عنابة", "قالمة",
  "قسنطينة", "المدية", "مستغانم", "المسيلة", "معسكر", "ورقلة", "وهران", "البيض",
  "إليزي", "برج بوعريريج", "بومرداس", "الطارف", "تندوف", "تيسمسيلت", "الوادي", "خنشلة",
  "سوق أهراس", "تيبازة", "ميلة", "عين الدفلى", "النعامة", "عين تموشنت", "غرداية", "غليزان",
  "تيميمون", "برج باجي مختار", "أولاد جلال", "بني عباس", "عين صالح", "عين قزام",
  "تقرت", "جانت", "المغير", "المنيعة"
];

// املأ القائمة
const wilayaSelect = document.getElementById('wilaya');
WILAYAS.forEach(w => {
  const opt = document.createElement('option');
  opt.value = w;
  opt.textContent = w;
  wilayaSelect.appendChild(opt);
});

// ============================================
// معالج التسجيل
// ============================================
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const submitBtn = document.getElementById('submitBtn');
  
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');
  
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const wilaya = document.getElementById('wilaya').value;
  const year = document.getElementById('year').value;
  const groupe = document.getElementById('groupe').value.trim();
  
  // تحقق من البريد
  if (!email.toLowerCase().endsWith('@enstp.edu.dz')) {
    errorMsg.textContent = '⚠️ Utilisez uniquement votre email @enstp.edu.dz';
    errorMsg.classList.add('show');
    return;
  }
  
  if (!app || !auth || !db) {
    errorMsg.textContent = '❌ Firebase non initialisé. Rechargez la page.';
    errorMsg.classList.add('show');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Création...';
  
  try {
    // 1. أنشئ الحساب
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    // 2. حدّث الاسم
    await updateProfile(user, { displayName: name });
    
    // 3. احفظ البيانات
    await setDoc(doc(db, 'users', user.uid), {
      uid: user.uid,
      email: email,
      name: name,
      wilaya: wilaya,
      year: year,
      groupe: groupe,
      role: 'student',
      createdAt: serverTimestamp()
    });
    
    successMsg.textContent = '✅ Compte créé ! Redirection...';
    successMsg.classList.add('show');
    setTimeout(() => {
      window.location.href = 'forum.html';
    }, 1500);
    
  } catch (err) {
    console.error(err);
    let msg = '❌ ' + err.message;
    if (err.code === 'auth/email-already-in-use') {
      msg = '❌ Cet email est déjà utilisé';
    } else if (err.code === 'auth/invalid-email') {
      msg = '❌ Email invalide';
    } else if (err.code === 'auth/weak-password') {
      msg = '❌ Mot de passe trop faible (min 6 caractères)';
    } else if (err.code === 'auth/operation-not-allowed') {
      msg = '❌ Email/Password non activé dans Firebase';
    } else if (err.code === 'permission-denied' || err.message.includes('permission')) {
      msg = '❌ Permissions Firestore — vérifiez les règles';
    }
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Créer mon compte';
  }
});

// ============================================
// إذا كان مسجلاً، اذهب مباشرة
// ============================================
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = 'forum.html';
  }
});
</script>

</body>
</html>
