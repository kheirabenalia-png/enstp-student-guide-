<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guide de survie ENSTP</title>

<script src="theme.js"></script>
<script src="text-size.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<meta name="theme-color" content="#c2410c">
<meta name="description" content="Guide de survie ENSTP — 3 langues, hors ligne">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENSTP Guide">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="offline-banner" id="offline-banner">📴 Mode hors ligne</div>

<!-- ============================================ -->
<!-- الشريط العلوي -->
<!-- ============================================ -->
<div class="top-controls">
  <div class="pill">
    <button onclick="setLang('fr')" data-lang="fr">🇫🇷 FR</button>
    <button onclick="setLang('ar')" data-lang="ar">🇩🇿 AR</button>
    <button onclick="setLang('en')" data-lang="en">🇬🇧 EN</button>
  </div>
  <div class="pill">
    <button class="ctrl-btn" onclick="toggleMode()" data-mode-toggle title="Mode">🌙</button>
    <button class="ctrl-btn" onclick="toggleThemePanel()" title="Couleurs">🎨</button>
    <button class="ctrl-btn" onclick="toggleTextSizePanel()" title="Taille du texte" id="text-size-btn">🅰️</button>
  </div>
</div>

<!-- ============================================ -->
<!-- لوحة الألوان -->
<!-- ============================================ -->
<div class="theme-panel" id="theme-panel">
  <div class="theme-panel-header">
    <strong id="tp-title">Couleur</strong>
    <button class="tp-close" onclick="closeThemePanel()">×</button>
  </div>
  <div class="theme-swatches">
    <button class="swatch orange" onclick="setTheme('orange')" data-theme-btn="orange" title="Orange"></button>
    <button class="swatch red" onclick="setTheme('red')" data-theme-btn="red" title="Rouge"></button>
    <button class="swatch green" onclick="setTheme('green')" data-theme-btn="green" title="Vert"></button>
    <button class="swatch blue" onclick="setTheme('blue')" data-theme-btn="blue" title="Bleu"></button>
    <button class="swatch purple" onclick="setTheme('purple')" data-theme-btn="purple" title="Violet"></button>
    <button class="swatch gray" onclick="setTheme('gray')" data-theme-btn="gray" title="Gris"></button>
  </div>
</div>

<!-- ============================================ -->
<!-- لوحة حجم النص -->
<!-- ============================================ -->
<div class="text-size-panel" id="text-size-panel">
  <div class="tsp-header">
    <strong id="tsp-title">Taille du texte</strong>
    <button class="tsp-close" onclick="closeTextSizePanel()">×</button>
  </div>
  <div class="tsp-list">
    <button class="tsp-btn" data-text-size-btn="small" onclick="setTextSize('small')">
      <span>🅰️- <span id="ts-small-label">Petit</span></span>
      <span class="tsp-label">14px</span>
    </button>
    <button class="tsp-btn" data-text-size-btn="normal" onclick="setTextSize('normal')">
      <span>🅰️ <span id="ts-normal-label">Normal</span></span>
      <span class="tsp-label">16px</span>
    </button>
    <button class="tsp-btn" data-text-size-btn="large" onclick="setTextSize('large')">
      <span>🅰️+ <span id="ts-large-label">Grand</span></span>
      <span class="tsp-label">19px</span>
    </button>
    <button class="tsp-btn" data-text-size-btn="xlarge" onclick="setTextSize('xlarge')">
      <span>🅰️++ <span id="ts-xlarge-label">Très grand</span></span>
      <span class="tsp-label">22px</span>
    </button>
  </div>
</div>

<!-- ============================================ -->
<!-- الرأس -->
<!-- ============================================ -->
<header style="background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:1.125rem 1rem .875rem;position:relative">
  <a href="index.html" id="home-link" style="position:absolute;top:1.125rem;right:1rem;color:#fff;text-decoration:none;font-size:.85rem;opacity:.9;font-weight:600">🏠 <span id="home-text">Accueil</span></a>
  <h1 id="siteName" style="margin:0;font-size:1.35rem;font-weight:800">Guide de survie ENSTP</h1>
  <p id="tagline" style="margin:.25rem 0 0;opacity:.9;font-size:.9rem">Ton premier jour, dans ta poche.</p>
</header>

<!-- ============================================ -->
<!-- مربع البحث -->
<!-- ============================================ -->
<div style="padding:.75rem 1rem;background:var(--card);border-bottom:1px solid var(--line)">
  <input id="q" placeholder="🔎 Chercher…" oninput="doSearch(this.value)"
         style="width:100%;padding:.75rem .875rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg);color:var(--ink);font-size:1rem;outline:none;font-family:inherit">
</div>

<!-- ============================================ -->
<!-- المحتوى الرئيسي -->
<!-- ============================================ -->
<main id="app" style="max-width:56rem;margin:0 auto;padding:.875rem"></main>

<!-- ============================================ -->
<!-- تحميل الملفات -->
<!-- ============================================ -->
<script src="lang.js"></script>

<script src="data/config.js"></script>
<script src="data/ecole.js"></script>
<script src="data/profs.js"></script>
<script src="data/admin.js"></script>
<script src="data/services.js"></script>
<script src="data/shopping.js"></script>
<script src="data/transport.js"></script>
<script src="data/cite.js"></script>
<script src="data/sport.js"></script>
<script src="data/green.js"></script>
<script src="data/podcast.js"></script>
<script src="data/courses.js"></script>
<script src="data/about.js"></script>
<script src="data/qr.js"></script>
<script src="data/index.js"></script>

<script src="search.js"></script>

<script>
// ============================================
// المتغيرات العامة
// ============================================
let LANG = localStorage.getItem('lang') || 'fr';
let CURRENT_SECTION = null;
let CURRENT_CATEGORY = null;

// ============================================
// نصوص اللوحة
// ============================================
const UI_TEXTS = {
  fr: {
    accueil: "Accueil",
    search: "🔎 Chercher : salle, prof, service…",
    back: "← Retour",
    noResult: "Aucun résultat",
    tryOther: "Essayez un autre mot",
    viewMap: "📍 Voir sur Maps",
    labelHours: "Horaires",
    labelBudget: "Budget",
    labelExtra: "Info",
    labelSteps: "Étapes",
    labelServices: "Services disponibles",
    mapPlaces: "Lieux",
    qrScan: "Scannez ce QR code",
    close: "Fermer",
    tspTitle: "Taille du texte",
    tsSmall: "Petit", tsNormal: "Normal", tsLarge: "Grand", tsXLarge: "Très grand"
  },
  ar: {
    accueil: "الرئيسية",
    search: "🔎 ابحث: قاعة، أستاذ، خدمة…",
    back: "→ رجوع",
    noResult: "لا توجد نتائج",
    tryOther: "جرّب كلمة أخرى",
    viewMap: "📍 عرض على الخريطة",
    labelHours: "المواعيد",
    labelBudget: "الميزانية",
    labelExtra: "معلومة",
    labelSteps: "الخطوات",
    labelServices: "الخدمات المتوفرة",
    mapPlaces: "الأماكن",
    qrScan: "امسح رمز QR",
    close: "إغلاق",
    tspTitle: "حجم النص",
    tsSmall: "صغير", tsNormal: "عادي", tsLarge: "كبير", tsXLarge: "كبير جداً"
  },
  en: {
    accueil: "Home",
    search: "🔎 Search: room, teacher, service…",
    back: "← Back",
    noResult: "No results",
    tryOther: "Try another word",
    viewMap: "📍 View on Maps",
    labelHours: "Hours",
    labelBudget: "Budget",
    labelExtra: "Info",
    labelSteps: "Steps",
    labelServices: "Available services",
    mapPlaces: "Places",
    qrScan: "Scan this QR code",
    close: "Close",
    tspTitle: "Text size",
    tsSmall: "Small", tsNormal: "Normal", tsLarge: "Large", tsXLarge: "X-Large"
  }
};

function ui(key) {
  const t = UI_TEXTS[LANG] || UI_TEXTS.fr;
  return t[key] || key;
}

// ============================================
// تبديل اللغة
// ============================================
function setLang(lang) {
  LANG = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  
  if (typeof CONFIG !== 'undefined' && CONFIG.siteName) {
    const sn = document.getElementById('siteName');
    const tg = document.getElementById('tagline');
    const ht = document.getElementById('home-text');
    if (sn) sn.textContent = CONFIG.siteName[lang] || CONFIG.siteName.fr;
    if (tg) tg.textContent = CONFIG.tagline[lang] || CONFIG.tagline.fr;
    if (ht) ht.textContent = ui('accueil');
  }
  
  const q = document.getElementById('q');
  if (q) q.placeholder = ui('search');
  
  // حدّث لوحة حجم النص
  const tspTitle = document.getElementById('tsp-title');
  if (tspTitle) tspTitle.textContent = ui('tspTitle');
  const labels = { 'ts-small-label': 'tsSmall', 'ts-normal-label': 'tsNormal', 'ts-large-label': 'tsLarge', 'ts-xlarge-label': 'tsXLarge' };
  Object.keys(labels).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = ui(labels[id]);
  });
  
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
  
  if (CURRENT_SECTION) {
    if (CURRENT_CATEGORY) renderCategory(CURRENT_SECTION, CURRENT_CATEGORY);
    else renderSection(CURRENT_SECTION);
  } else {
    renderHome();
  }
}

// ============================================
// الصفحة الرئيسية
// ============================================
function renderHome() {
  CURRENT_SECTION = null;
  CURRENT_CATEGORY = null;
  
  const app = document.getElementById('app');
  
  if (typeof window.SECTIONS === 'undefined' || !window.SECTIONS.length) {
    app.innerHTML = '<div style="text-align:center;padding:2.5rem;color:var(--mut)"><b style="font-size:3rem">⏳</b><br>Chargement…</div>';
    return;
  }
  
  let html = '<div class="tile-grid">';
  window.SECTIONS.forEach(s => {
    const title = (typeof window.t === 'function') ? window.t(s.titleKey, LANG) : s.titleKey;
    html += '<button class="tile-3d" onclick="openSection(\'' + s.id + '\')">';
    html += '<span class="tile-icon">' + s.icon + '</span>';
    html += '<span class="tile-label">' + title + '</span>';
    html += '</button>';
  });
  html += '</div>';
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// فتح قسم
// ============================================
function openSection(id) {
  CURRENT_SECTION = id;
  CURRENT_CATEGORY = null;
  const s = window.SECTIONS.find(x => x.id === id);
  if (!s) return;
  
  if (s.type === 'qr') { renderQR(s); return; }
  if (s.categories && s.categories.length > 0) { renderCategoriesList(id); return; }
  if (s.items && s.items.length > 0) { renderItems(s, s.items); return; }
  if (s.buildings) { renderMap(s); return; }
}

// ============================================
// عرض التصنيفات
// ============================================
function renderCategoriesList(sectionId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s || !s.categories) return;
  
  const app = document.getElementById('app');
  const title = window.t(s.titleKey, LANG);
  const intro = window.t(s.introKey, LANG);
  
  let html = '<button class="back" onclick="renderHome()">' + ui('back') + '</button>';
  html += '<h2>' + s.icon + ' ' + title + '</h2>';
  html += '<p style="color:var(--mut);margin-bottom:1rem">' + intro + '</p>';
  html += '<div class="tile-grid">';
  
  s.categories.forEach(c => {
    const ct = c.titleKey ? window.t(c.titleKey, LANG) : (c.title || '');
    html += '<button class="tile-3d" onclick="renderCategory(\'' + s.id + '\',\'' + c.id + '\')">';
    html += '<span class="tile-icon">' + (c.icon || '📁') + '</span>';
    html += '<span class="tile-label">' + ct + '</span>';
    html += '</button>';
  });
  
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// عرض تصنيف
// ============================================
function renderCategory(sectionId, categoryId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s || !s.categories) return;
  const c = s.categories.find(x => x.id === categoryId);
  if (!c) return;
  
  CURRENT_SECTION = sectionId;
  CURRENT_CATEGORY = categoryId;
  
  if (c.type === 'map' && c.buildings) { renderMap(s, c); return; }
  if (c.items) { renderItems(s, c.items, c); return; }
}

// ============================================
// عرض البطاقات
// ============================================
function renderItems(section, items, category) {
  const app = document.getElementById('app');
  
  let html = '';
  if (category) {
    html += '<button class="back" onclick="renderCategoriesList(\'' + section.id + '\')">' + ui('back') + '</button>';
    const ct = category.titleKey ? window.t(category.titleKey, LANG) : (category.title || '');
    html += '<h2>' + (category.icon || '') + ' ' + ct + '</h2>';
  } else {
    html += '<button class="back" onclick="renderHome()">' + ui('back') + '</button>';
    const title = window.t(section.titleKey, LANG);
    const intro = window.t(section.introKey, LANG);
    html += '<h2>' + section.icon + ' ' + title + '</h2>';
    html += '<p style="color:var(--mut);margin-bottom:1rem">' + intro + '</p>';
  }
  
  items.forEach((item, idx) => {
    const title = window.t(item.titleKey, LANG);
    const desc = item.descKey ? window.t(item.descKey, LANG) : '';
    
    html += '<div class="card-3d" style="margin-bottom:.875rem">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.625rem">';
    html += '<h3 style="margin:0;color:var(--acc);font-size:1.1rem">' + (item.icon || '') + ' ' + title + '</h3>';
    html += '<button onclick="showQR(\'' + section.id + '\',' + idx + ',\'' + (category ? category.id : '') + '\')" style="background:var(--acc-soft);border:0;color:var(--acc);padding:.375rem .625rem;border-radius:.625rem;cursor:pointer;font-size:1rem">📱</button>';
    html += '</div>';
    
    if (item.img) {
      html += '<img src="' + item.img + '" style="width:100%;border-radius:.625rem;margin:.625rem 0" loading="lazy" alt="">';
    }
    
    if (item.video) {
      html += '<div style="position:relative;padding-bottom:56.25%;height:0;margin:.625rem 0;border-radius:.625rem;overflow:hidden">';
      html += '<iframe src="https://www.youtube.com/embed/' + item.video + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe>';
      html += '</div>';
    }
    
    if (desc) html += '<p style="color:var(--mut);margin:.5rem 0;font-size:.95rem;line-height:1.6">' + desc + '</p>';
    if (item.hours) html += '<p style="margin:.375rem 0;font-size:.9rem"><b>🕐 ' + ui('labelHours') + ':</b> ' + item.hours + '</p>';
    if (item.budget) html += '<p style="margin:.375rem 0;font-size:.9rem"><b>💰 ' + ui('labelBudget') + ':</b> ' + item.budget + '</p>';
    if (item.extra) html += '<p style="margin:.375rem 0;font-size:.9rem;color:var(--acc)"><b>' + item.extra + '</b></p>';
    
    if (item.services && item.services.length) {
      html += '<p style="margin:.625rem 0 .375rem;font-weight:600;color:var(--acc)">' + ui('labelServices') + ':</p>';
      html += '<ul style="padding-' + (LANG === 'ar' ? 'right' : 'left') + ':1.25rem;color:var(--mut);font-size:.9rem">';
      item.services.forEach(srv => { html += '<li>' + (srv[LANG] || srv.fr) + '</li>'; });
      html += '</ul>';
    }
    
    if (item.steps && item.steps.length) {
      html += '<details style="margin-top:.625rem">';
      html += '<summary style="cursor:pointer;color:var(--acc);font-weight:600;font-size:.9rem">📋 ' + ui('labelSteps') + '</summary>';
      html += '<ol style="padding-' + (LANG === 'ar' ? 'right' : 'left') + ':1.25rem;margin-top:.5rem;color:var(--mut);font-size:.9rem;line-height:1.7">';
      item.steps.forEach(step => { html += '<li>' + (step[LANG] || step.fr) + '</li>'; });
      html += '</ol></details>';
    }
    
    if (item.link) html += '<a href="' + item.link + '" target="_blank" rel="noopener" class="btn" style="margin-top:.625rem;display:inline-block">🔗 ' + item.link + '</a>';
    
    if (item.map) {
      const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.map);
      html += '<a href="' + mapUrl + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:.625rem;padding:.5rem .875rem;background:var(--acc);color:#fff;border-radius:1.25rem;text-decoration:none;font-size:.9rem">' + ui('viewMap') + '</a>';
    }
    
    html += '</div>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// عرض قسم
// ============================================
function renderSection(id) {
  const s = window.SECTIONS.find(x => x.id === id);
  if (!s) return;
  CURRENT_SECTION = id;
  CURRENT_CATEGORY = null;
  
  if (s.categories && s.categories.length > 0) renderCategoriesList(id);
  else if (s.type === 'qr') renderQR(s);
  else if (s.items) renderItems(s, s.items);
  else if (s.buildings) renderMap(s);
}

// ============================================
// عرض الخريطة
// ============================================
function renderMap(section, category) {
  const app = document.getElementById('app');
  const buildings = (category ? category.buildings : section.buildings) || [];
  
  let html = '';
  if (category) {
    html += '<button class="back" onclick="renderCategoriesList(\'' + section.id + '\')">' + ui('back') + '</button>';
    const ct = category.titleKey ? window.t(category.titleKey, LANG) : (category.title || '');
    html += '<h2>' + (category.icon || '🗺️') + ' ' + ct + '</h2>';
  } else {
    html += '<button class="back" onclick="renderHome()">' + ui('back') + '</button>';
    html += '<h2>' + section.icon + ' ' + window.t(section.titleKey, LANG) + '</h2>';
  }
  
  const desc = (category && category.descKey) ? window.t(category.descKey, LANG) : window.t(section.introKey, LANG);
  html += '<p style="color:var(--mut);margin-bottom:1rem">' + desc + '</p>';
  
  html += '<div style="position:relative;width:100%;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:1rem;overflow:hidden;margin:.75rem 0">';
  html += '<div style="position:relative;width:100%;height:100%;background:linear-gradient(135deg,var(--acc-soft),var(--card))">';
  
  buildings.forEach(b => {
    const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
    html += '<button onclick="showPlace(\'' + section.id + '\',\'' + b.id + '\',\'' + (category ? category.id : '') + '\')" style="position:absolute;left:' + b.x + '%;top:' + b.y + '%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--acc);border-radius:50%;width:2.5rem;height:2.5rem;font-size:1.125rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15);padding:0" title="' + name + '">' + b.icon + '</button>';
  });
  
  html += '</div></div>';
  
  html += '<h3 style="color:var(--acc);margin:1.25rem 0 .75rem">📍 ' + ui('mapPlaces') + '</h3>';
  buildings.forEach(b => {
    const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
    html += '<button style="width:100%;text-align:left;margin-bottom:.625rem;cursor:pointer;padding:.875rem;display:flex;align-items:center;gap:.625rem;background:var(--card);border:1px solid var(--line);border-radius:.75rem;color:var(--ink);font-family:inherit;font-size:1rem" onclick="showPlace(\'' + section.id + '\',\'' + b.id + '\',\'' + (category ? category.id : '') + '\')">';
    html += '<span style="font-size:1.5rem">' + b.icon + '</span>';
    html += '<span style="font-weight:600">' + name + '</span>';
    html += '</button>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

function showPlace(sectionId, buildingId, categoryId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s) return;
  let buildings;
  if (categoryId && s.categories) {
    const c = s.categories.find(x => x.id === categoryId);
    buildings = c ? c.buildings : [];
  } else {
    buildings = s.buildings;
  }
  if (!buildings) return;
  const b = buildings.find(x => x.id === buildingId);
  if (!b) return;
  const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
  alert('📍 ' + name);
}

// ============================================
// عرض QR
// ============================================
function renderQR(section) {
  const app = document.getElementById('app');
  
  let html = '<button class="back" onclick="renderHome()">' + ui('back') + '</button>';
  html += '<h2>' + section.icon + ' ' + window.t(section.titleKey, LANG) + '</h2>';
  html += '<p style="color:var(--mut);margin-bottom:1rem">' + window.t('qrIntro', LANG) + '</p>';
  html += '<div id="qr-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.875rem"></div>';
  
  app.innerHTML = html;
  
  setTimeout(() => {
    const grid = document.getElementById('qr-grid');
    if (!grid) return;
    const base = location.origin + location.pathname;
    
    window.SECTIONS.filter(x => x.id !== 'qr').forEach(sec => {
      const title = window.t(sec.titleKey, LANG);
      const div = document.createElement('div');
      div.style.cssText = 'background:var(--card);border:1px solid var(--line);border-radius:.875rem;padding:.875rem;text-align:center';
      
      const qrId = 'qrc-' + sec.id;
      div.innerHTML = '<div style="background:#fff;padding:.5rem;display:inline-block;border-radius:.5rem;margin-bottom:.5rem" id="' + qrId + '"></div><div style="font-size:.85rem;font-weight:600">' + sec.icon + ' ' + title + '</div>';
      grid.appendChild(div);
      
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById(qrId), {
          text: base + '#' + sec.id,
          width: 120, height: 120,
          colorDark: '#1d2433', colorLight: '#ffffff'
        });
      }
    });
  }, 100);
}

function showQR(sectionId, itemIndex, categoryId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s) return;
  
  let item;
  if (categoryId && s.categories) {
    const c = s.categories.find(x => x.id === categoryId);
    if (c && c.items) item = c.items[itemIndex];
  } else if (s.items) {
    item = s.items[itemIndex];
  }
  if (!item) return;
  
  const url = location.origin + location.pathname + '#' + sectionId;
  const title = window.t(item.titleKey, LANG);
  
  const overlay = document.createElement('div');
  overlay.id = 'qr-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1.25rem;backdrop-filter:blur(4px)';
  
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;padding:1.5rem;border-radius:1.25rem;text-align:center;max-width:20rem;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)';
  box.innerHTML = '<h3 style="margin:0 0 .5rem;color:#c2410c;font-size:1.1rem">📱 ' + title + '</h3>' +
                  '<p style="margin:0 0 1rem;color:#667085;font-size:.85rem">' + ui('qrScan') + '</p>' +
                  '<div id="qr-popup-box" style="background:#fff;padding:.75rem;display:inline-block;border-radius:.75rem;border:1px solid #e5e1d8"></div>' +
                  '<p style="margin:1rem 0 0;font-size:.75rem;color:#94a3b8;word-break:break-all">' + url + '</p>' +
                  '<button onclick="closeQR()" style="margin-top:1rem;padding:.625rem 1.5rem;background:#c2410c;color:#fff;border:0;border-radius:1.25rem;font-weight:600;cursor:pointer;font-family:inherit">' + ui('close') + '</button>';
  
  overlay.appendChild(box);
  overlay.onclick = (e) => { if (e.target === overlay) closeQR(); };
  document.body.appendChild(overlay);
  
  setTimeout(() => {
    const qrBox = document.getElementById('qr-popup-box');
    if (qrBox && typeof QRCode !== 'undefined') {
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: url, width: 200, height: 200, colorDark: '#1d2433', colorLight: '#ffffff' });
    }
  }, 50);
}

function closeQR() {
  const overlay = document.getElementById('qr-overlay');
  if (overlay) overlay.remove();
}

// ============================================
// البحث
// ============================================
function doSearch(q) {
  q = q.trim();
  if (!q) { renderHome(); return; }
  
  const results = (typeof smartSearch === 'function') ? smartSearch(q, window.SECTIONS) : [];
  const app = document.getElementById('app');
  
  if (results.length === 0) {
    app.innerHTML = '<div style="text-align:center;padding:2.5rem;color:var(--mut)"><b style="font-size:3rem">🔍</b><br>' + ui('noResult') + '<br><small>' + ui('tryOther') + '</small></div>';
    return;
  }
  
  let html = '<h2>🔍 ' + results.length + '</h2>';
  results.forEach(r => {
    const title = window.t(r.item.titleKey, LANG);
    const desc = r.item.descKey ? window.t(r.item.descKey, LANG) : '';
    
    html += '<div class="card-3d" style="margin-bottom:.75rem">';
    html += '<h3 style="color:var(--acc);margin:0 0 .375rem">' + (r.item.icon || r.section.icon) + ' ' + title + '</h3>';
    if (desc) html += '<p style="color:var(--mut);font-size:.9rem">' + desc + '</p>';
    html += '</div>';
  });
  
  app.innerHTML = html;
}

// ============================================
// فتح قسم من الرابط
// ============================================
function handleHash() {
  const h = location.hash.slice(1);
  if (h && window.SECTIONS.find(s => s.id === h)) {
    openSection(h);
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', handleHash);

// ============================================
// حالة الاتصال
// ============================================
function updateOnlineStatus() {
  document.body.classList.toggle('offline', !navigator.onLine);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ============================================
// Service Worker
// ============================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(() => console.log('✅ SW'))
      .catch((err) => console.log('❌ SW:', err));
  });
}

// ============================================
// البدء
// ============================================
(function init() {
  if (typeof applyTheme === 'function') applyTheme();
  if (typeof applyTextSize === 'function') applyTextSize();
  setLang(localStorage.getItem('lang') || 'fr');
  setTimeout(handleHash, 200);
})();
</script>

</body>
</html>
