
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guide de survie ENSTP</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#667085;--acc:#c2410c;--acc2:#fde8dc;--line:#e5e1d8}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1f2430;--ink:#eef0f5;--mut:#9aa3b5;--acc:#fb923c;--acc2:#3a2a20;--line:#2d3342}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:18px 16px 14px;position:relative}
header h1{margin:0;font-size:1.35rem}
header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
.home-link{position:absolute;top:18px;right:16px;color:#fff;text-decoration:none;font-size:.85rem;opacity:.85;font-weight:600}
.langs{display:flex;gap:6px;margin-top:10px}
.langs button{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;font-family:inherit}
.langs button.on{background:#fff;color:var(--acc)}
.search{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:1rem;outline:none}
main{max-width:640px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--ink);text-decoration:none;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:1.8rem;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:1.02rem}
.card p{margin:2px 0;color:var(--mut);font-size:.93rem}
.btn{display:inline-block;margin-top:8px;padding:8px 14px;background:var(--acc);color:#fff;border-radius:20px;text-decoration:none;font-size:.9rem;border:0;cursor:pointer}
.back{background:none;border:0;color:var(--acc);font-size:1rem;padding:6px 0;cursor:pointer;font-weight:600;font-family:inherit}
h2{margin:6px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty b{display:block;font-size:2.5rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:.95rem;cursor:pointer;font-family:inherit}
.opt>div{margin-top:8px;color:var(--mut);font-size:.9rem;line-height:1.6}
.qr-btn{background:var(--acc2);border:0;color:var(--acc);padding:6px 10px;border-radius:10px;cursor:pointer;font-size:1rem;flex-shrink:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-head h3{flex:1;margin:0 0 6px}
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qr-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;font-size:.82rem;font-weight:600}
.qr-item .qr-box{background:#fff;padding:8px;display:inline-block;border-radius:8px;margin-bottom:8px}
.qr-item .qr-box img,.qr-item .qr-box canvas{display:block!important}
</style>
</head>
<body>
<header>
  <a href="index.html" class="home-link">🏠 Accueil</a>
  <h1 id="siteName">Guide de survie ENSTP</h1>
  <p id="tagline">Ton premier jour, dans ta poche.</p>
  <div class="langs">
    <button onclick="setLang('fr')" id="btn-fr">🇫🇷 FR</button>
    <button onclick="setLang('ar')" id="btn-ar">🇩🇿 AR</button>
    <button onclick="setLang('en')" id="btn-en">🇬🇧 EN</button>
  </div>
</header>
<div class="search">
  <input id="q" placeholder="🔎 Chercher..." oninput="doSearch(this.value)">
</div>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<script>
// ============================================
// محرك البحث الذكي
// ============================================
const SYNONYMS = {
  "manger":["restaurant","repas","snack","café","pizzeria","nourriture"],
  "restaurant":["manger","repas","snack"],
  "salle":["classe","amphi","amphithéâtre","cours","td","tp"],
  "amphi":["amphithéâtre","salle","cours"],
  "problème":["aide","souci","difficulté","service"],
  "aide":["problème","service","secours"],
  "absence":["absent","justificatif","manqué"],
  "carte":["badge","étudiant","identité"],
  "transport":["bus","taxi","métro","déplacement"],
  "bus":["transport","arrêt","ligne"],
  "taxi":["transport","voiture","station"],
  "cité":["résidence","logement","chambre"],
  "résidence":["cité","logement","chambre"],
  "prof":["enseignant","professeur"],
  "enseignant":["prof","professeur"],
  "bibliothèque":["livre","adhésion","prêt"],
  "notes":["résultats","examens","moyenne"],
  "أكل":["مطعم","ماكلة","وجبة","طعام"],
  "ماكلة":["أكل","مطعم","وجبة"],
  "مطعم":["أكل","ماكلة","وجبة"],
  "قاعة":["قسم","مدرج","صف"],
  "مدرج":["قاعة","حصة"],
  "مشكلة":["مساعدة","سؤال","خدمة"],
  "مساعدة":["مشكلة","خدمة"],
  "غياب":["غائب","تبرير","مبرر"],
  "بطاقة":["هوية","شارة"],
  "نقل":["حافلة","طاكسي","مترو"],
  "حافلة":["نقل","باص","محطة"],
  "طاكسي":["نقل","سيارة","تكسي"],
  "إقامة":["حي","سكن","غرفة"],
  "سكن":["إقامة","حي","غرفة"],
  "أستاذ":["معلم","بروف"],
  "أساتذة":["أستاذ","معلم"],
  "مكتبة":["كتاب","انضمام","استعارة"],
  "نقاط":["نتائج","امتحانات","معدل"],
  "eat":["restaurant","food","meal"],
  "room":["class","amphi","classroom"],
  "problem":["help","issue","service"],
  "dorm":["residence","housing","room"],
  "teacher":["professor","instructor"],
  "library":["book","membership"],
  "grades":["results","exams","marks"]
};

function normalize(text) {
  if (!text) return '';
  return text.toString().toLowerCase()
    .replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a').replace(/[îï]/g,'i')
    .replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/[ç]/g,'c')
    .replace(/[إأآا]/g,'ا').replace(/[ىي]/g,'ي').replace(/[ةه]/g,'ه')
    .replace(/[ًٌٍَُِّْ]/g,'').trim();
}

function expandWord(word) {
  const norm = normalize(word);
  const expanded = new Set([norm]);
  Object.keys(SYNONYMS).forEach(key => {
    if (normalize(key) === norm) {
      SYNONYMS[key].forEach(syn => expanded.add(normalize(syn)));
    }
  });
  return Array.from(expanded);
}

function smartSearch(query, sections) {
  const q = normalize(query);
  if (!q) return [];
  const words = q.split(/\s+/).filter(w => w.length > 1);
  if (words.length === 0) return [];
  const expandedWords = words.map(w => expandWord(w));
  const results = [];

  sections.forEach(section => {
    if (section.items) {
      section.items.forEach((item, idx) => {
        let score = 0;
        const titleText = normalize((item.title?.fr||'')+' '+(item.title?.ar||'')+' '+(item.title?.en||''));
        const descText = normalize((item.desc?.fr||'')+' '+(item.desc?.ar||'')+' '+(item.desc?.en||''));
        const secText = normalize((section.title?.fr||'')+' '+(section.title?.ar||'')+' '+(section.title?.en||''));
        expandedWords.forEach(group => group.forEach(w => {
          if (titleText.includes(w)) score += 10;
          if (descText.includes(w)) score += 3;
          if (secText.includes(w)) score += 1;
        }));
        if (score > 0) results.push({section, item, itemIndex: idx, score});
      });
    }
    if (section.tree) {
      section.tree.forEach(node => {
        let score = 0;
        const qText = normalize((node.q?.fr||'')+' '+(node.q?.ar||'')+' '+(node.q?.en||''));
        const aText = normalize((node.a?.service?.fr||'')+' '+(node.a?.service?.ar||'')+' '+(node.a?.service?.en||'')+' '+(node.a?.procedure?.fr||'')+' '+(node.a?.procedure?.ar||'')+' '+(node.a?.procedure?.en||''));
        expandedWords.forEach(group => group.forEach(w => {
          if (qText.includes(w)) score += 10;
          if (aText.includes(w)) score += 3;
        }));
        if (score > 0) results.push({section, item:{title:node.q, desc:node.a.service, procedure:node.a.procedure}, score});
      });
    }
  });

  results.sort((a,b) => b.score - a.score);
  return results;
}

// ============================================
// المتغيرات العامة
// ============================================
let LANG = localStorage.getItem('lang') || (typeof CONFIG !== 'undefined' && CONFIG.defaultLang) || 'fr';
let CURRENT_SECTION = null;

const T = {
  fr: { search: "🔎 Chercher : salle, bus, médecin…", back: "← Retour", noResult: "Aucun résultat", tryOther: "Essayez un autre mot", viewMap: "📍 Voir sur Maps", qrTitle: "📱 QR Codes à imprimer", qrDesc: "Scannez ces QR codes pour accéder directement aux rubriques." },
  ar: { search: "🔎 ابحث: قاعة، حافلة، طبيب…", back: "→ رجوع", noResult: "لا توجد نتائج", tryOther: "جرّب كلمة أخرى", viewMap: "📍 عرض على الخريطة", qrTitle: "📱 رموز QR للطباعة", qrDesc: "امسح رموز QR هذه للوصول مباشرة إلى الأقسام." },
  en: { search: "🔎 Search: room, bus, doctor…", back: "← Back", noResult: "No results", tryOther: "Try another word", viewMap: "📍 View on Maps", qrTitle: "📱 QR Codes to print", qrDesc: "Scan these QR codes to access sections directly." }
};

// ============================================
// تغيير اللغة
// ============================================
function setLang(l) {
  LANG = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  if (typeof CONFIG !== 'undefined') {
    document.getElementById('siteName').textContent = CONFIG.siteName[l];
    document.getElementById('tagline').textContent = CONFIG.tagline[l];
  }
  document.getElementById('q').placeholder = T[l].search;
  document.querySelectorAll('.langs button').forEach(b => b.classList.remove('on'));
  document.getElementById('btn-' + l).classList.add('on');
  if (CURRENT_SECTION) { renderSection(CURRENT_SECTION); } else { renderHome(); }
}

// ============================================
// الصفحة الرئيسية (شبكة الأقسام)
// ============================================
function renderHome() {
  CURRENT_SECTION = null;
  if (location.hash) history.replaceState(null, '', location.pathname);
  const app = document.getElementById('app');
  app.innerHTML = '<div class="grid" id="grid"></div>';
  const grid = document.getElementById('grid');
  SECTIONS.forEach(s => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = '#' + s.id;
    a.innerHTML = '<b>' + s.icon + '</b>' + s.title[LANG];
    a.onclick = (e) => { e.preventDefault(); openSection(s.id); };
    grid.appendChild(a);
  });
}

// ============================================
// فتح قسم
// ============================================
function openSection(id) {
  const s = SECTIONS.find(x => x.id === id);
  if (!s) return;
  CURRENT_SECTION = id;
  location.hash = id;
  renderSection(id);
}

function renderSection(id) {
  const s = SECTIONS.find(x => x.id === id);
  if (!s) return;
  const app = document.getElementById('app');
  let html = '<button class="back" onclick="renderHome()">' + T[LANG].back + '</button>';
  html += '<h2>' + s.icon + ' ' + s.title[LANG] + '</h2>';
  html += '<p>' + s.intro[LANG] + '</p>';

  // قسم QR الرئيسي
  if (s.type === 'qr') {
    html += '<p style="color:var(--mut);font-size:.9rem">' + T[LANG].qrDesc + '</p>';
    html += '<div class="qr-grid" id="qr-grid"></div>';
    app.innerHTML = html;
    // توليد QR
    setTimeout(() => {
      const grid = document.getElementById('qr-grid');
      if (!grid) return;
      const base = location.origin + location.pathname;
      SECTIONS.filter(x => x.type !== 'qr').forEach((sec, i) => {
        const div = document.createElement('div');
        div.className = 'qr-item';
        const num = String(i + 1).padStart(2, '0');
        div.innerHTML = '<div class="qr-box" id="qrc-' + sec.id + '"></div><div><b>QR ' + num + '</b><br>' + sec.icon + ' ' + sec.title[LANG] + '</div>';
        grid.appendChild(div);
        if (typeof QRCode !== 'undefined') {
          new QRCode(document.getElementById('qrc-' + sec.id), {
            text: base + '#' + sec.id,
            width: 120, height: 120,
            colorDark: '#1d2433', colorLight: '#ffffff'
          });
        }
      });
    }, 50);
    window.scrollTo(0, 0);
    return;
  }

  // شجرة المشاكل
  if (s.type === 'tree' && s.tree) {
    s.tree.forEach((node, i) => {
      html += '<button class="opt" onclick="toggleTree(' + i + ')">' + node.q[LANG] + '<div id="tree-' + i + '" hidden>➡️ <b>' + node.a.service[LANG] + '</b><br>' + node.a.procedure[LANG] + '</div></button>';
    });
  } else if (s.items) {
    s.items.forEach((item, idx) => {
      html += '<div class="card">';
      html += '<div class="card-head">';
      html += '<h3>' + item.title[LANG] + '</h3>';
      html += '<button class="qr-btn" onclick="showQR(\'' + s.id + '\',' + idx + ')" title="QR">📱</button>';
      html += '</div>';
      if (item.desc) html += '<p>' + item.desc[LANG] + '</p>';
      if (item.map) {
        const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.map);
        html += '<a class="btn" target="_blank" rel="noopener" href="' + url + '">' + T[LANG].viewMap + '</a>';
      }
      html += '</div>';
    });
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

function toggleTree(i) {
  const el = document.getElementById('tree-' + i);
  if (el) el.hidden = !el.hidden;
}

// ============================================
// QR Code لكل عنصر
// ============================================
function showQR(sectionId, itemIndex) {
  const s = SECTIONS.find(x => x.id === sectionId);
  if (!s || !s.items) return;
  const item = s.items[itemIndex];
  if (!item) return;
  const url = location.origin + location.pathname + '#' + sectionId;
  const title = item.title[LANG];

  const overlay = document.createElement('div');
  overlay.id = 'qr-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(4px)';

  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;padding:24px;border-radius:20px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)';
  box.innerHTML = '<h3 style="margin:0 0 8px;color:#c2410c;font-size:1.1rem">📱 ' + title + '</h3>' +
                  '<p style="margin:0 0 16px;color:#667085;font-size:.85rem;line-height:1.4">Scannez ce QR code</p>' +
                  '<div id="qr-box" style="background:#fff;padding:12px;display:inline-block;border-radius:12px;border:1px solid #e5e1d8"></div>' +
                  '<p style="margin:16px 0 0;font-size:.75rem;color:#94a3b8;word-break:break-all">' + url + '</p>' +
                  '<button onclick="closeQR()" style="margin-top:16px;padding:10px 24px;background:#c2410c;color:#fff;border:0;border-radius:20px;font-weight:600;cursor:pointer;font-size:.9rem">Fermer</button>';
  overlay.appendChild(box);
  overlay.onclick = (e) => { if (e.target === overlay) closeQR(); };
  document.body.appendChild(overlay);

  setTimeout(() => {
    const qrBox = document.getElementById('qr-box');
    if (qrBox && typeof QRCode !== 'undefined') {
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: url, width: 200, height: 200, colorDark: '#1d2433', colorLight: '#ffffff' });
    }
  }, 50);
}

function closeQR() {
  const overlay = document.getElementById('qr-overlay');
  if (overlay) overlay.remove();
}

// ============================================
// البحث
// ============================================
function doSearch(q) {
  q = q.trim();
  if (!q) { renderHome(); return; }
  const results = smartSearch(q, SECTIONS);
  const app = document.getElementById('app');
  if (results.length === 0) {
    app.innerHTML = '<div class="empty"><b>🔍</b>' + T[LANG].noResult + '<br><small>' + T[LANG].tryOther + '</small></div>';
    return;
  }
  let html = '<h2>🔍 ' + results.length + '</h2>';
  results.forEach(r => {
    html += '<div class="card">';
    html += '<div class="card-head">';
    html += '<h3>' + r.section.icon + ' ' + r.item.title[LANG] + '</h3>';
    if (r.itemIndex !== undefined) {
      html += '<button class="qr-btn" onclick="showQR(\'' + r.section.id + '\',' + r.itemIndex + ')" title="QR">📱</button>';
    }
    html += '</div>';
    if (r.item.desc) html += '<p>' + r.item.desc[LANG] + '</p>';
    if (r.item.procedure) html += '<p style="color:var(--acc);font-weight:600">➡️ ' + r.item.procedure[LANG] + '</p>';
    html += '</div>';
  });
  app.innerHTML = html;
}

// ============================================
// فتح القسم تلقائياً من الرابط (#)
// ============================================
function handleHash() {
  const h = location.hash.slice(1);
  if (h && SECTIONS.find(s => s.id === h)) {
    CURRENT_SECTION = h;
    renderSection(h);
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', handleHash);

// ============================================
// البدء
// ============================================
setLang(LANG);
handleHash();
</script>
</body>
</html>
