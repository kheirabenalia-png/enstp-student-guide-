<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guide de survie ENSTP</title>

<script src="theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<meta name="theme-color" content="#c2410c">
<meta name="description" content="Guide de survie ENSTP — 3 langues, hors ligne">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENSTP Guide">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="offline-banner" id="offline-banner">📴 Mode hors ligne</div>

<!-- ============================================ -->
<!-- الشريط العلوي -->
<!-- ============================================ -->
<div class="top-controls">
  <div class="pill">
    <button onclick="setLang('fr')" data-lang="fr">🇫🇷 FR</button>
    <button onclick="setLang('ar')" data-lang="ar">🇩🇿 AR</button>
    <button onclick="setLang('en')" data-lang="en">🇬🇧 EN</button>
  </div>
  <div class="pill">
    <button class="ctrl-btn" onclick="toggleMode()" data-mode-toggle title="Mode">🌙</button>
    <button class="ctrl-btn" onclick="toggleThemePanel()" title="Couleurs">🎨</button>
  </div>
</div>

<!-- ============================================ -->
<!-- لوحة الألوان -->
<!-- ============================================ -->
<div class="theme-panel" id="theme-panel">
  <div class="theme-panel-header">
    <strong id="tp-title">Couleur</strong>
    <button class="tp-close" onclick="closeThemePanel()">×</button>
  </div>
  <div class="theme-swatches">
    <button class="swatch orange" onclick="setTheme('orange')" data-theme-btn="orange" title="Orange"></button>
    <button class="swatch red" onclick="setTheme('red')" data-theme-btn="red" title="Rouge"></button>
    <button class="swatch green" onclick="setTheme('green')" data-theme-btn="green" title="Vert"></button>
    <button class="swatch blue" onclick="setTheme('blue')" data-theme-btn="blue" title="Bleu"></button>
    <button class="swatch purple" onclick="setTheme('purple')" data-theme-btn="purple" title="Violet"></button>
    <button class="swatch gray" onclick="setTheme('gray')" data-theme-btn="gray" title="Gris"></button>
  </div>
</div>

<!-- ============================================ -->
<!-- الرأس -->
<!-- ============================================ -->
<header style="background:var(--acc);color:#fff;padding:18px 16px 14px;position:relative">
  <a href="index.html" style="position:absolute;top:18px;right:16px;color:#fff;text-decoration:none;font-size:.85rem;opacity:.85;font-weight:600" id="home-link">🏠 Accueil</a>
  <h1 id="siteName" style="margin:0;font-size:1.35rem">Guide de survie ENSTP</h1>
  <p id="tagline" style="margin:4px 0 0;opacity:.9;font-size:.9rem">Ton premier jour, dans ta poche.</p>
</header>

<!-- ============================================ -->
<!-- مربع البحث -->
<!-- ============================================ -->
<div class="search-bar" style="padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)">
  <input id="q" placeholder="🔎 Chercher…" oninput="doSearch(this.value)" 
         style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:1rem;outline:none">
</div>

<!-- ============================================ -->
<!-- المحتوى الرئيسي -->
<!-- ============================================ -->
<main id="app" style="max-width:900px;margin:0 auto;padding:14px"></main>

<!-- ============================================ -->
<!-- تحميل ملفات الأقسام -->
<!-- ============================================ -->
<script src="lang.js"></script>
<script src="data/config.js"></script>
<script src="data/ecole.js"></script>
<script src="data/profs.js"></script>
<script src="data/admin.js"></script>
<script src="data/services.js"></script>
<script src="data/shopping.js"></script>
<script src="data/transport.js"></script>
<script src="data/cite.js"></script>
<script src="data/sport.js"></script>
<script src="data/green.js"></script>
<script src="data/podcast.js"></script>
<script src="data/courses.js"></script>
<script src="data/about.js"></script>
<script src="data/qr.js"></script>
<script src="data/index.js"></script>
<script src="search.js"></script>

<script>
// ============================================
// المتغيرات العامة
// ============================================
let LANG = localStorage.getItem('lang') || 'fr';
let CURRENT_SECTION = null;
let CURRENT_CATEGORY = null;

// ============================================
// تبديل اللغة
// ============================================
function setLang(lang) {
  LANG = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  
  // تحديث الرأس
  if (typeof CONFIG !== 'undefined') {
    document.getElementById('siteName').textContent = CONFIG.siteName[lang];
    document.getElementById('tagline').textContent = CONFIG.tagline[lang];
  }
  
  // تحديث placeholder
  const q = document.getElementById('q');
  if (q && typeof LANG_DATA !== 'undefined') {
    q.placeholder = LANG_DATA[lang].search;
  }
  
  // تحديث الأزرار النشطة
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
  
  // تحديث الواجهة
  if (CURRENT_SECTION) {
    if (CURRENT_CATEGORY) {
      renderCategory(CURRENT_SECTION, CURRENT_CATEGORY);
    } else {
      renderSection(CURRENT_SECTION);
    }
  } else {
    renderHome();
  }
}

// ============================================
// الصفحة الرئيسية (شبكة الأقسام)
// ============================================
function renderHome() {
  CURRENT_SECTION = null;
  CURRENT_CATEGORY = null;
  
  const app = document.getElementById('app');
  
  if (typeof window.SECTIONS === 'undefined' || !window.SECTIONS.length) {
    app.innerHTML = '<div style="text-align:center;padding:40px;color:var(--mut)"><b style="font-size:3rem">⏳</b><br>Chargement…</div>';
    return;
  }
  
  let html = '<div class="tile-grid">';
  window.SECTIONS.forEach(s => {
    const title = window.t ? window.t(s.titleKey, LANG) : s.titleKey;
    html += '<button class="tile-3d" onclick="openSection(\'' + s.id + '\')">';
    html += '<span class="tile-icon">' + s.icon + '</span>';
    html += '<span class="tile-label">' + title + '</span>';
    html += '</button>';
  });
  html += '</div>';
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// فتح قسم
// ============================================
function openSection(id) {
  CURRENT_SECTION = id;
  CURRENT_CATEGORY = null;
  const s = window.SECTIONS.find(x => x.id === id);
  if (!s) return;
  
  // إذا كان القسم يحتوي على تصنيفات
  if (s.categories && s.categories.length > 0) {
    renderCategoriesList(id);
    return;
  }
  
  // إذا كان القسم من نوع QR
  if (s.type === 'qr') {
    renderQR(s);
    return;
  }
  
  // إذا كان القسم فيه items مباشرة
  if (s.items && s.items.length > 0) {
    renderItems(s, s.items);
    return;
  }
  
  // إذا كان من نوع map
  if (s.buildings) {
    renderMap(s);
    return;
  }
}

// ============================================
// عرض تصنيفات قسم
// ============================================
function renderCategoriesList(sectionId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s || !s.categories) return;
  
  const app = document.getElementById('app');
  const title = window.t(s.titleKey, LANG);
  const intro = window.t(s.introKey, LANG);
  
  let html = '<button class="back" onclick="renderHome()">' + window.t('back', LANG) + '</button>';
  html += '<h2>' + s.icon + ' ' + title + '</h2>';
  html += '<p style="color:var(--mut);margin-bottom:16px">' + intro + '</p>';
  html += '<div class="tile-grid">';
  
  s.categories.forEach(c => {
    const ct = c.titleKey ? window.t(c.titleKey, LANG) : (c.title || '');
    html += '<button class="tile-3d" onclick="renderCategory(\'' + s.id + '\',\'' + c.id + '\')">';
    html += '<span class="tile-icon">' + (c.icon || '📁') + '</span>';
    html += '<span class="tile-label">' + ct + '</span>';
    html += '</button>';
  });
  
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// عرض تصنيف محدد
// ============================================
function renderCategory(sectionId, categoryId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s || !s.categories) return;
  const c = s.categories.find(x => x.id === categoryId);
  if (!c) return;
  
  CURRENT_SECTION = sectionId;
  CURRENT_CATEGORY = categoryId;
  
  // إذا كان تصنيف خريطة
  if (c.type === 'map' && c.buildings) {
    renderMap(s, c);
    return;
  }
  
  // إذا كان فيه items
  if (c.items) {
    renderItems(s, c.items, c);
    return;
  }
}

// ============================================
// عرض البطاقات
// ============================================
function renderItems(section, items, category) {
  const app = document.getElementById('app');
  
  let html = '';
  if (category) {
    html += '<button class="back" onclick="renderCategoriesList(\'' + section.id + '\')">' + window.t('back', LANG) + '</button>';
    const ct = category.titleKey ? window.t(category.titleKey, LANG) : (category.title || '');
    html += '<h2>' + (category.icon || '') + ' ' + ct + '</h2>';
  } else {
    html += '<button class="back" onclick="renderHome()">' + window.t('back', LANG) + '</button>';
    const title = window.t(section.titleKey, LANG);
    const intro = window.t(section.introKey, LANG);
    html += '<h2>' + section.icon + ' ' + title + '</h2>';
    html += '<p style="color:var(--mut);margin-bottom:16px">' + intro + '</p>';
  }
  
  items.forEach((item, idx) => {
    const title = window.t(item.titleKey, LANG);
    const desc = item.descKey ? window.t(item.descKey, LANG) : '';
    
    html += '<div class="card-3d" style="margin-bottom:14px">';
    
    // رأس البطاقة
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">';
    html += '<h3 style="margin:0;color:var(--acc);font-size:1.1rem">' + (item.icon || '') + ' ' + title + '</h3>';
    html += '<button onclick="showQR(\'' + section.id + '\',' + idx + ')" style="background:var(--acc-soft);border:0;color:var(--acc);padding:6px 10px;border-radius:10px;cursor:pointer;font-size:1rem">📱</button>';
    html += '</div>';
    
    // صورة
    if (item.img) {
      html += '<img src="' + item.img + '" style="width:100%;border-radius:10px;margin:10px 0" loading="lazy" alt="">';
    }
    
    // فيديو
    if (item.video) {
      html += '<div style="position:relative;padding-bottom:56.25%;height:0;margin:10px 0;border-radius:10px;overflow:hidden">';
      html += '<iframe src="https://www.youtube.com/embed/' + item.video + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe>';
      html += '</div>';
    }
    
    // الوصف
    if (desc) {
      html += '<p style="color:var(--mut);margin:8px 0;font-size:.95rem;line-height:1.6">' + desc + '</p>';
    }
    
    // المواعيد
    if (item.hours) {
      html += '<p style="margin:6px 0;font-size:.9rem"><b>🕐 ' + window.t('labelHours', LANG) + ':</b> ' + item.hours + '</p>';
    }
    
    // الميزانية
    if (item.budget) {
      html += '<p style="margin:6px 0;font-size:.9rem"><b>💰 ' + window.t('labelBudget', LANG) + ':</b> ' + item.budget + '</p>';
    }
    
    // معلومة إضافية
    if (item.extra) {
      html += '<p style="margin:6px 0;font-size:.9rem;color:var(--acc)"><b>' + item.extra + '</b></p>';
    }
    
    // الخدمات المتوفرة
    if (item.services && item.services.length) {
      html += '<p style="margin:10px 0 6px;font-weight:600;color:var(--acc)">' + window.t('labelServices', LANG) + ':</p>';
      html += '<ul style="padding-' + (LANG === 'ar' ? 'right' : 'left') + ':20px;color:var(--mut);font-size:.9rem">';
      item.services.forEach(srv => {
        html += '<li>' + srv[LANG] + '</li>';
      });
      html += '</ul>';
    }
    
    // الخطوات
    if (item.steps && item.steps.length) {
      html += '<details style="margin-top:10px">';
      html += '<summary style="cursor:pointer;color:var(--acc);font-weight:600;font-size:.9rem">📋 ' + window.t('labelSteps', LANG) + '</summary>';
      html += '<ol style="padding-' + (LANG === 'ar' ? 'right' : 'left') + ':20px;margin-top:8px;color:var(--mut);font-size:.9rem;line-height:1.7">';
      item.steps.forEach(step => {
        html += '<li>' + step[LANG] + '</li>';
      });
      html += '</ol>';
      html += '</details>';
    }
    
    // رابط
    if (item.link) {
      html += '<a href="' + item.link + '" target="_blank" rel="noopener" class="btn" style="margin-top:10px">🔗 ' + item.link + '</a>';
    }
    
    // خريطة
    if (item.map) {
      const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.map);
      html += '<a href="' + mapUrl + '" target="_blank" rel="noopener" class="btn" style="margin-top:10px">' + window.t('viewMap', LANG) + '</a>';
    }
    
    html += '</div>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================
// عرض قسم
// ============================================
function renderSection(id) {
  const s = window.SECTIONS.find(x => x.id === id);
  if (!s) return;
  CURRENT_SECTION = id;
  CURRENT_CATEGORY = null;
  
  if (s.categories && s.categories.length > 0) {
    renderCategoriesList(id);
  } else if (s.type === 'qr') {
    renderQR(s);
  } else if (s.items) {
    renderItems(s, s.items);
  } else if (s.buildings) {
    renderMap(s);
  }
}

// ============================================
// عرض الخريطة
// ============================================
function renderMap(section, category) {
  const app = document.getElementById('app');
  const buildings = (category ? category.buildings : section.buildings) || [];
  
  let html = '';
  if (category) {
    html += '<button class="back" onclick="renderCategoriesList(\'' + section.id + '\')">' + window.t('back', LANG) + '</button>';
    const ct = category.titleKey ? window.t(category.titleKey, LANG) : (category.title || '');
    html += '<h2>' + (category.icon || '🗺️') + ' ' + ct + '</h2>';
  } else {
    html += '<button class="back" onclick="renderHome()">' + window.t('back', LANG) + '</button>';
    html += '<h2>' + section.icon + ' ' + window.t(section.titleKey, LANG) + '</h2>';
  }
  
  html += '<p style="color:var(--mut);margin-bottom:16px">' + (category && category.descKey ? window.t(category.descKey, LANG) : window.t(section.introKey, LANG)) + '</p>';
  
  // الخريطة
  html += '<div style="position:relative;width:100%;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:12px 0">';
  html += '<div style="position:relative;width:100%;height:100%;background:linear-gradient(135deg,var(--acc-soft),var(--card))">';
  buildings.forEach(b => {
    const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
    html += '<button onclick="showPlace(\'' + section.id + '\',\'' + b.id + '\',\'' + (category ? category.id : '') + '\')" style="position:absolute;left:' + b.x + '%;top:' + b.y + '%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--acc);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15)" title="' + name + '">' + b.icon + '</button>';
  });
  html += '</div>';
  html += '</div>';
  
  // قائمة الأماكن
  html += '<h3 style="color:var(--acc);margin:20px 0 12px">📍 ' + window.t('mapPlaces', LANG) + '</h3>';
  buildings.forEach(b => {
    const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
    html += '<button class="card-3d" style="width:100%;text-align:left;margin-bottom:10px;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px" onclick="showPlace(\'' + section.id + '\',\'' + b.id + '\',\'' + (category ? category.id : '') + '\')">';
    html += '<span style="font-size:1.5rem">' + b.icon + '</span>';
    html += '<span style="font-weight:600">' + name + '</span>';
    html += '</button>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

function showPlace(sectionId, buildingId, categoryId) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s) return;
  let buildings;
  if (categoryId) {
    const c = s.categories.find(x => x.id === categoryId);
    buildings = c ? c.buildings : [];
  } else {
    buildings = s.buildings;
  }
  if (!buildings) return;
  const b = buildings.find(x => x.id === buildingId);
  if (!b) return;
  const name = b.nameKey ? window.t(b.nameKey, LANG) : (b.name || '');
  alert('📍 ' + name);
}

// ============================================
// عرض QR
// ============================================
function renderQR(section) {
  const app = document.getElementById('app');
  
  let html = '<button class="back" onclick="renderHome()">' + window.t('back', LANG) + '</button>';
  html += '<h2>' + section.icon + ' ' + window.t(section.titleKey, LANG) + '</h2>';
  html += '<p style="color:var(--mut);margin-bottom:16px">' + window.t('qrIntro', LANG) + '</p>';
  
  html += '<div class="qr-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px" id="qr-grid"></div>';
  
  app.innerHTML = html;
  
  // توليد QR لكل قسم
  setTimeout(() => {
    const grid = document.getElementById('qr-grid');
    if (!grid) return;
    const base = location.origin + location.pathname;
    
    window.SECTIONS.filter(s => s.id !== 'qr').forEach((sec, i) => {
      const title = window.t(sec.titleKey, LANG);
      const div = document.createElement('div');
      div.className = 'card-3d';
      div.style.textAlign = 'center';
      div.style.padding = '14px';
      
      const qrId = 'qrc-' + sec.id;
      div.innerHTML = '<div style="background:#fff;padding:8px;display:inline-block;border-radius:8px;margin-bottom:8px" id="' + qrId + '"></div><div style="font-size:.85rem;font-weight:600">' + sec.icon + ' ' + title + '</div>';
      grid.appendChild(div);
      
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById(qrId), {
          text: base + '#' + sec.id,
          width: 120, height: 120,
          colorDark: '#1d2433', colorLight: '#ffffff'
        });
      }
    });
  }, 100);
}

function showQR(sectionId, itemIndex) {
  const s = window.SECTIONS.find(x => x.id === sectionId);
  if (!s) return;
  
  let item;
  // البحث في items أو في categories
  if (s.items) {
    item = s.items[itemIndex];
  } else if (s.categories) {
    // البحث في جميع الـ categories
    let found = false;
    for (const cat of s.categories) {
      if (cat.items && cat.items[itemIndex]) {
        item = cat.items[itemIndex];
        found = true;
        break;
      }
    }
    if (!found) return;
  } else {
    return;
  }
  if (!item) return;
  
  const url = location.origin + location.pathname + '#' + sectionId;
  const title = window.t(item.titleKey, LANG);
  
  const overlay = document.createElement('div');
  overlay.id = 'qr-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(4px)';
  
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;padding:24px;border-radius:20px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)';
  box.innerHTML = '<h3 style="margin:0 0 8px;color:#c2410c;font-size:1.1rem">📱 ' + title + '</h3>' +
                  '<p style="margin:0 0 16px;color:#667085;font-size:.85rem">' + window.t('qrScan', LANG) + '</p>' +
                  '<div id="qr-popup-box" style="background:#fff;padding:12px;display:inline-block;border-radius:12px;border:1px solid #e5e1d8"></div>' +
                  '<p style="margin:16px 0 0;font-size:.75rem;color:#94a3b8;word-break:break-all">' + url + '</p>' +
                  '<button onclick="closeQR()" style="margin-top:16px;padding:10px 24px;background:#c2410c;color:#fff;border:0;border-radius:20px;font-weight:600;cursor:pointer">' + window.t('close', LANG) + '</button>';
  
  overlay.appendChild(box);
  overlay.onclick = (e) => { if (e.target === overlay) closeQR(); };
  document.body.appendChild(overlay);
  
  setTimeout(() => {
    const qrBox = document.getElementById('qr-popup-box');
    if (qrBox && typeof QRCode !== 'undefined') {
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: url, width: 200, height: 200, colorDark: '#1d2433', colorLight: '#ffffff' });
    }
  }, 50);
}

function closeQR() {
  const overlay = document.getElementById('qr-overlay');
  if (overlay) overlay.remove();
}

// ============================================
// البحث
// ============================================
function doSearch(q) {
  q = q.trim();
  if (!q) { renderHome(); return; }
  
  const results = (typeof smartSearch === 'function') 
    ? smartSearch(q, window.SECTIONS) 
    : [];
  
  const app = document.getElementById('app');
  
  if (results.length === 0) {
    app.innerHTML = '<div style="text-align:center;padding:40px;color:var(--mut)"><b style="font-size:3rem">🔍</b><br>' + window.t('noResult', LANG) + '<br><small>' + window.t('tryOther', LANG) + '</small></div>';
    return;
  }
  
  let html = '<h2>🔍 ' + results.length + '</h2>';
  results.forEach(r => {
    const title = window.t(r.item.titleKey, LANG);
    const desc = r.item.descKey ? window.t(r.item.descKey, LANG) : '';
    
    html += '<div class="card-3d" style="margin-bottom:12px">';
    html += '<h3 style="color:var(--acc);margin:0 0 6px">' + (r.item.icon || r.section.icon) + ' ' + title + '</h3>';
    if (desc) html += '<p style="color:var(--mut);font-size:.9rem">' + desc + '</p>';
    html += '</div>';
  });
  
  app.innerHTML = html;
}

// ============================================
// فتح قسم من الرابط (#)
// ============================================
function handleHash() {
  const h = location.hash.slice(1);
  if (h && window.SECTIONS.find(s => s.id === h)) {
    openSection(h);
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', handleHash);

// ============================================
// حالة الاتصال
// ============================================
function updateOnlineStatus() {
  document.body.classList.toggle('offline', !navigator.onLine);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ============================================
// Service Worker
// ============================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(() => console.log('✅ SW'))
      .catch((err) => console.log('❌ SW:', err));
  });
}

// ============================================
// البدء
// ============================================
(function init() {
  // طبّق الثيم
  if (typeof applyTheme === 'function') applyTheme();
  
  // طبّق اللغة
  setLang(localStorage.getItem('lang') || 'fr');
  
  // افتح القسم من الرابط
  setTimeout(handleHash, 100);
})();
</script>

</body>
</html>
